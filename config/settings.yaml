project: "Profit-Optimal Credit Decisioning"
seed: 42
negative_weight: 20
train_val_split_ratio: 0.8
cv_folds: 5
early_stopping_rounds: 75
bootstrap_auc_reps: 300
calibration_method: "isotonic"
calibration_folds: 5
calibration_bins: 12

model:
  lgbm:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_alpha: 0.0
    reg_lambda: 0.0
    n_jobs: -1
    verbose: -1
  lr:
    C: 0.1
    max_iter: 1000

paths:
  raw_train_data: "data/raw/train_data.csv"
  raw_train_labels: "data/raw/train_labels.csv"
  raw_test_data: "data/raw/test_data.csv"
  parquet_train_data: "data/parquet/train_data.parquet"
  parquet_train_labels: "data/parquet/train_labels.parquet"
  parquet_test_sample: "data/parquet/test_sample.parquet"
  processed_features: "data/processed/customer_features.parquet"
  test_features: "data/processed/test_customer_features.parquet"
  oof_predictions: "data/processed/oof_predictions.parquet"
  calibrated_predictions: "data/processed/oof_predictions_calibrated.parquet"
  artifacts: "artifacts"
  reports: "reports"
  figures: "figures"
  dashboard_data: "dashboards/data"
  demo: "data/demo"
