name: CI

on:
  push:
    branches: [main, feat/reviewer-ready]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Test
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q

      - name: Verify generated docs
        run: python scripts/verify_docs.py

      - name: Rebuild static demo
        run: python -m src.demo.build_site

      - name: Check generated files are committed
        run: |
          git diff --exit-code -- README.md docs/index.html docs/RESULTS.md docs/MODEL_CARD.md docs/DECISION_MEMO.md docs/assets
