[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "breakpoint-credit-risk"
version = "1.0.0"
description = "Calibrated credit-risk model and constrained Grow/Hold/Restrict policy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahin Igam" }]
keywords = ["credit-risk", "lightgbm", "calibration", "decision-policy", "tableau"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "duckdb==1.5.6",
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "PyYAML==6.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "shap==0.51.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.urls]
Homepage = "https://github.com/mahinigam/breakpoint"
Repository = "https://github.com/mahinigam/breakpoint"
Issues = "https://github.com/mahinigam/breakpoint/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
extraPaths = ["."]
executionEnvironments = [{ root = "." }]
